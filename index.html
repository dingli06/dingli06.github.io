<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李定嘉 - 个人简历</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <!-- 各区块由 components/main.js 渲染进对应挂载点 -->
    <div class="rs-container">
        <div id="section-header"></div>

        <!-- 视图切换：拼图模式 / 完整列表 -->
        <div class="rs-view-switch" id="view-switch" role="tablist">
            <button class="rs-tab is-active" data-rs-view="metro" type="button">磁贴模式</button>
            <button class="rs-tab" data-rs-view="list" type="button">长图模式</button>
        </div>

        <!-- 拼图（WinPE8 Metro 磁贴）模式容器 -->
        <div id="section-metro" class="rs-metro"></div>

        <!-- 完整列表模式容器（默认隐藏，拼图模式下不渲染） -->
        <div id="section-list-hidden" hidden>
            <div id="section-job"></div>
            <div id="section-education"></div>
            <div id="section-skills"></div>
            <div id="section-experience"></div>
            <div id="section-awards"></div>
            <div id="section-projects"></div>
            <div id="section-hobbies"></div>
            <div id="section-gallery"></div>
        </div>
    </div>

    <!-- 页脚 -->
    <div id="section-footer"></div>

    <!-- 组件装配（纯前端 ES Module，无需构建，GitHub Pages 直接可用） -->
    <script type="module" src="./components/main.js"></script>
</body>
</html>
